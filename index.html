<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chetan Mehra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#dcebe2; --stage:#eef5f0; --panel:#f8f6f0; --ink:#23362d; --muted:#5d7468; --line:#b9cdc0; --ring:#e9937c; --frame:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1b2823; --stage:#15201c; --panel:#24352e; --ink:#e6efe9; --muted:#9bb2a6; --line:#364a40; --ring:#f0a58f; --frame:#f4f1ea; }
}
:root[data-theme="dark"]{ --bg:#1b2823; --stage:#15201c; --panel:#24352e; --ink:#e6efe9; --muted:#9bb2a6; --line:#364a40; --ring:#f0a58f; --frame:#f4f1ea; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.4 'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,.tile:focus-visible{outline:2px solid var(--ring);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 4px;gap:10px}
h1{margin:0;font:700 24px/1 'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.03em}
.top h1{flex:1;min-width:0;overflow:hidden;white-space:nowrap;padding:6px 0;font-size:34px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.top h1{position:relative;height:1.3em;box-sizing:content-box}
.nameTrack{position:absolute;top:50%;left:100%;white-space:nowrap;margin-top:-.65em;animation:nameScroll 12s linear infinite}
.top h1:hover .nameTrack{animation-play-state:paused}
.nameTrack span{display:inline-block;font-weight:800;line-height:1.3;letter-spacing:.02em;
  background:linear-gradient(90deg,#ff9a6c,#e0568f,#7a5cd6,#2fa89a,#ff9a6c);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:nameShine 6s linear infinite}
@keyframes nameScroll{to{left:0;transform:translateX(-100%)}}
@keyframes nameShine{to{background-position:300% 0}}
@media (max-width:600px){.top h1{font-size:26px}}
@media (prefers-reduced-motion: reduce){.nameTrack,.nameTrack span{animation:none}.nameTrack{left:0}}
.actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.chips,.row{display:flex;gap:6px;overflow-x:auto;align-items:center;scrollbar-width:none}
.chips::-webkit-scrollbar,.row::-webkit-scrollbar{display:none}
.chips{padding:6px 14px 8px}
.pill{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.del{border-style:dashed;color:var(--muted)}
.pill small{opacity:.65;margin-left:4px;font-size:12px}

/* folder tabs */
.chips{border-bottom:1px solid var(--line);padding-bottom:0;gap:2px;margin:0 8px}
.chips .pill{border-radius:12px 12px 0 0;border-bottom:0;padding:8px 14px}
.chips .pill[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.stagewrap{position:relative;flex:1;min-height:0;margin:0 8px}
.stage{position:absolute;inset:0;overflow:hidden;border-radius:24px;background:var(--stage);
  background-image:radial-gradient(circle at 18% 12%,rgba(255,255,255,.55),transparent 45%),radial-gradient(circle at 88% 92%,rgba(188,212,230,.35),transparent 50%)}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;display:flex;gap:10px;align-items:center;font-size:13px;white-space:nowrap;max-width:calc(100% - 20px);z-index:50}
.hint .btn{padding:5px 11px;font-size:13px}
.stage.drag::after{content:"Drop to add";position:absolute;inset:8px;border:2px dashed var(--ring);border-radius:18px;display:grid;place-items:center;font:600 22px 'Bricolage Grotesque',sans-serif;background:rgba(255,255,255,.35);z-index:60}

.bgpic{position:absolute;inset:0;background-size:auto,contain,cover;background-position:center;background-repeat:no-repeat;filter:blur(4px);pointer-events:none}
/* tiles + shapes */
.tile{position:relative;filter:drop-shadow(0 6px 12px rgba(20,40,30,.22));cursor:zoom-in}
.shape,.mw{width:100%;height:100%;clip-path:var(--clip);-webkit-clip-path:var(--clip);transition:clip-path 1.6s cubic-bezier(.65,0,.25,1),-webkit-clip-path 1.6s cubic-bezier(.65,0,.25,1)}
.stage.framed .shape{background:var(--frame);padding:5px}
.mw{overflow:hidden;background:#cfd9d2}
.mw img,.mw video{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}

/* collage */
.collage .tile{position:absolute;transform:rotate(var(--r,0deg));transition:transform .35s;animation:pop .6s backwards;animation-delay:calc(var(--d,0)*60ms)}
.collage .nav{z-index:150;width:58px;height:58px;display:grid;place-items:center;padding:0;color:#fff;
  background:linear-gradient(135deg,rgba(255,255,255,.38),rgba(255,255,255,.12));
  border:1.5px solid rgba(255,255,255,.65);backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);
  box-shadow:0 8px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .25s cubic-bezier(.3,1.5,.5,1),background .25s,box-shadow .25s;animation:navpulse 2.6s ease-in-out infinite}
.collage .nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));transition:transform .25s}
.collage .nav.prev{left:16px}.collage .nav.next{right:16px}
.collage .nav:hover{background:linear-gradient(135deg,#ff9a6c,#e0568f);border-color:#fff;animation:none;transform:translateY(-50%) scale(1.15);box-shadow:0 10px 30px rgba(224,86,143,.55)}
.collage .nav.prev:hover svg{transform:translateX(-3px)}.collage .nav.next:hover svg{transform:translateX(3px)}
.collage .nav:active{transform:translateY(-50%) scale(.92)}
@keyframes navpulse{0%,100%{box-shadow:0 8px 24px rgba(0,0,0,.28),0 0 0 0 rgba(255,255,255,.45)}50%{box-shadow:0 8px 24px rgba(0,0,0,.28),0 0 0 12px rgba(255,255,255,0)}}
/* phone: arrows become a bar centred under the photos */
@media (max-width:600px){
  .collage .nav{top:auto;bottom:10px;transform:none;width:46px;height:46px;animation:none}
  .collage .nav svg{width:20px;height:20px}
  .collage .nav.prev{left:calc(50% - 56px)}.collage .nav.next{left:calc(50% + 10px);right:auto}
  .collage .nav:hover,.collage .nav:active{transform:scale(1.1)}
  .stage{border-radius:18px}
}
/* laptop: hover lift only where a mouse exists */
@media (hover:none){.collage .tile:hover{transform:rotate(var(--r,0deg))}}
.collage .tile:hover{transform:rotate(0deg) scale(1.06);z-index:99!important}
@keyframes pop{from{opacity:0;transform:rotate(var(--r,0deg)) scale(.7)}}

/* bento */
.stage.bento{overflow-y:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));grid-auto-rows:96px;gap:10px;grid-auto-flow:dense}
.bento .tile{width:auto;height:auto}
.bento .b2{grid-column:span 2;grid-row:span 2}.bento .bw{grid-column:span 2}.bento .bt{grid-row:span 2}

/* marquee */
.lanes{position:absolute;inset:0;display:flex;flex-direction:column;gap:var(--gap,12px);padding:var(--gap,12px)}
.tilt .lanes{inset:-25%;transform:rotate(-8deg)}
.lanes.v{flex-direction:row}
.lane{flex:1;min-height:0;min-width:0;overflow:hidden;display:flex}
.track{display:flex;width:max-content;height:100%;animation:mqx linear infinite}
.track .tile{flex:none;margin-right:var(--gap,12px);filter:none}
.track.v{flex-direction:column;width:100%;height:max-content;animation-name:mqy}
.track.v .tile{margin-right:0;margin-bottom:var(--gap,12px)}
.lane:hover .track{animation-play-state:paused}
@keyframes mqx{to{transform:translateX(-50%)}}
@keyframes mqy{to{transform:translateY(-50%)}}
@media (prefers-reduced-motion: reduce){.track{animation:none}.collage .tile{animation:none}.shape,.mw{transition-duration:.01s}}

/* slideshow */
.show{display:grid;place-items:center}
.show .tile{animation:fade .6s}
@keyframes fade{from{opacity:0}}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:22px;line-height:1;z-index:5}
.nav.prev{left:10px}.nav.next{right:10px}
.count{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:var(--muted);font-size:13px}

/* dock */
.dock{padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px}
.opts{gap:14px;font-size:14px;color:var(--muted)}
.opts label{display:flex;align-items:center;gap:8px;flex:none;white-space:nowrap}
.opts input[type=range]{width:96px;accent-color:var(--ink)}
.opts select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 6px}
.opts input[type=checkbox]{accent-color:var(--ink);width:16px;height:16px}
.ring{flex:none;position:relative;width:38px;height:38px;border:0;background:none;padding:0;cursor:pointer;margin-left:auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--ring);stroke-linecap:round;stroke-dasharray:94.2;stroke-dashoffset:0}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink)}
.ring.off{opacity:.35}

/* sheet + lightbox */
.sheet{position:fixed;inset:0;background:rgba(16,28,22,.55);display:grid;place-items:end center;z-index:200}
.card{background:var(--panel);width:min(480px,100%);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font:700 20px 'Bricolage Grotesque',sans-serif}
.card p{margin:0;color:var(--muted);font-size:14px}
.card input[type=text]{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--stage)}
.drop{border:2px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.lb{position:fixed;inset:0;background:rgba(10,18,14,.88);display:grid;place-items:center;z-index:300;padding:16px}
.lb img,.lb video{max-width:100%;max-height:100%;border-radius:12px}
.exitclean{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:120;opacity:.75}
body.clean .top,body.clean .chips,body.clean .dock{display:none}
body.clean .stagewrap{margin:0}
body.clean .stage{border-radius:0}
</style>
</head>
<body>
<header class="top">
  <h1 aria-label="Chetan Mehra"><div class="nameTrack" aria-hidden="true"><span>Chetan Mehra</span></div></h1>
  <div class="actions">
    <button class="btn" id="reconnect" type="button" hidden>Reconnect folder</button>
  </div>
</header>
<nav class="chips" id="chips" role="tablist" aria-label="Folders"></nav>
<div class="stagewrap">
  <main class="stage" id="stage"></main>
  <div class="hint" id="hint" hidden><span>Sample tiles. Add your own photos and videos.</span><button class="btn primary" id="hintAdd" type="button">Add media</button></div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Add media</h2>
    <p>Photos and videos stay on this device. Pick a folder to keep its name, or name one below for loose files.</p>
    <input type="text" id="fname" placeholder="Folder name, for example Goa trip" aria-label="Folder name">
    <div class="drop">Or drop files and whole folders anywhere on the wall</div>
    <div class="btns">
      <button class="btn primary" id="pickFiles" type="button">Choose files</button>
      <button class="btn" id="pickDir" type="button">Choose a folder</button>
      <button class="btn" id="linkDir" type="button">Link a folder (auto-sync)</button>
      <button class="btn" id="sheetClose" type="button">Done</button>
    </div>
    <input type="file" id="fFiles" accept="image/*,video/*" multiple hidden>
    <input type="file" id="fDir" webkitdirectory multiple hidden>
  </div>
</div>
<button class="btn primary exitclean" id="exitClean" type="button" hidden>Show controls</button>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var stage=$('#stage');

/* ---------- shapes: 48-point polygons so they morph smoothly ---------- */
var SHAPES=[['soft','Soft'],['circle','Circle'],['squircle','Squircle'],['hexagon','Hexagon'],['diamond','Diamond'],['flower','Flower'],['star','Star'],['blob','Blob']];
var CLIPS={};
(function(){
  var N=48,P=Math.PI;
  var fn={
    soft:function(t){var c=Math.abs(Math.cos(t)),s=Math.abs(Math.sin(t));return 50/Math.pow(Math.pow(c,8)+Math.pow(s,8),1/8)},
    circle:function(){return 50},
    squircle:function(t){var c=Math.abs(Math.cos(t)),s=Math.abs(Math.sin(t));return 50/Math.pow(Math.pow(c,3)+Math.pow(s,3),1/3)},
    hexagon:function(t){var a=((t+P/6)%(P/3))-P/6;return 43.3/Math.cos(a)},
    diamond:function(t){return 50/(Math.abs(Math.cos(t))+Math.abs(Math.sin(t)))},
    flower:function(t){return 50*(0.78+0.22*Math.cos(6*t))},
    star:function(t){var u=(t/(P/4))%1;return 26+24*Math.abs(2*u-1)},
    blob:function(t){return 50*(0.84+0.07*Math.cos(2*t+1)+0.06*Math.cos(3*t)-0.03*Math.sin(5*t))}
  };
  SHAPES.forEach(function(s){
    var pts=[];
    for(var i=0;i<N;i++){
      var t=i*2*P/N,r=fn[s[0]](t);
      var x=Math.min(100,Math.max(0,50+r*Math.cos(t))),y=Math.min(100,Math.max(0,50+r*Math.sin(t)));
      pts.push(x.toFixed(1)+'% '+y.toFixed(1)+'%');
    }
    CLIPS[s[0]]='polygon('+pts.join(',')+')';
  });
})();

/* ---------- state ---------- */
var LAYOUTS=[['collage','Collage'],['bento','Bento'],['rows','Rows'],['cols','Columns'],['tilt','Tilted'],['show','Slideshow']];
var state={folder:'all',layout:'collage',shape:'soft',speed:60,interval:20,frame:true,cycle:0,seed:1,batch:0,slide:0};
try{var sv=JSON.parse(localStorage.getItem('moodwall-prefs')||'{}');[].forEach(function(k){if(sv[k]!==undefined)state[k]=sv[k]})}catch(e){}
function savePrefs(){try{localStorage.setItem('moodwall-prefs',JSON.stringify({speed:state.speed,interval:state.interval,frame:state.frame}))}catch(e){}}
var items=[],slideT=null,last=Date.now();
var linkedRecs=[];

/* ---------- sample tiles ---------- */
var PALS=[['#f6c9b8','#e9a38c','#fdf0e6'],['#bcd4e6','#8fb4d1','#eaf3f9'],['#cfe3c9','#9cc59a','#f1f8ee'],['#f2dca4','#e6b96a','#fff6e0'],['#d9c6ec','#b49bd6','#f4edfb'],['#f4b9c4','#e58a9d','#fdeef1'],['#c6e2e0','#8cc3c0','#eefaf9'],['#e7c9a9','#c99a6b','#faf0e4'],['#cbd5e8','#97a6cf','#eef1fa']];
function sampleSvg(i){
  var p=PALS[i%PALS.length],cx=90+((i*83)%220),cy=110+((i*57)%120);
  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+p[2]+'"/><stop offset="1" stop-color="'+p[0]+'"/></linearGradient></defs><rect width="400" height="500" fill="url(#g)"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(46+(i%3)*10)+'" fill="'+p[2]+'" opacity=".9"/><path d="M0 360 Q110 '+(290+(i%4)*14)+' 220 350 T400 330 V500 H0Z" fill="'+p[1]+'" opacity=".75"/><path d="M0 420 Q140 360 260 420 T400 400 V500 H0Z" fill="'+p[1]+'"/></svg>';
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
var samples=[];for(var i=0;i<9;i++)samples.push({id:'s'+i,folder:'Sample',name:'Sample '+(i+1),type:'image',url:sampleSvg(i),sample:true});

/* ---------- bundled photos (shown by default) ---------- */
var PAGE=5; /* photos shown at once in the collage */
/* Every top-level repo folder becomes a tab. On GitHub Pages the folder list is read live from the
   repo; this list is only the fallback when that is unavailable (offline, rate limit, local file). */
var BUNDLED=['Vaishno Devi 2023/454DB216-1EA8-4852-A869-5CE016A9F405.JPG','Vaishno Devi 2023/0362A76F-4642-41EC-9A8D-8154F42DF06A.JPG','Vaishno Devi 2023/541D9B8C-F1CB-4984-B044-85D7606E2597.JPG','Vaishno Devi 2023/87635430-7992-45F2-86CA-F863CF41E0C6.JPG','Vaishno Devi 2023/A06EC386-2E62-4A3C-8A35-8B7A570BC820.JPG','Vaishno Devi 2023/D8AA3D67-06C2-46FC-9697-CBAD03304034.JPG','Vaishno Devi 2023 -2/454DB216-1EA8-4852-A869-5CE016A9F405.JPG','Vaishno Devi 2023 -2/87A59FFD-89D4-456B-A028-1604C4D7C1E0.JPG','Vaishno Devi 2023 -2/IMG_0826.JPG'];
var MEDIA_RE=/\.(jpe?g|png|gif|webp|avif|bmp|mp4|webm|mov|m4v)$/i,VIDEO_RE=/\.(mp4|webm|mov|m4v)$/i;
function discoverPhotos(){
  var m=location.hostname.match(/^([^.]+)\.github\.io$/i),repo=location.pathname.split('/')[1];
  if(!m||!repo)return Promise.resolve(null);
  var ctl=window.AbortController?new AbortController():null,timer=setTimeout(function(){if(ctl)ctl.abort()},5000);
  return fetch('https://api.github.com/repos/'+m[1]+'/'+repo+'/git/trees/HEAD?recursive=1',ctl?{signal:ctl.signal}:{})
    .then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(j){
      clearTimeout(timer);
      var paths=(j.tree||[]).filter(function(n){return n.type==='blob'&&n.path.split('/').length===2&&n.path.charAt(0)!=='.'&&MEDIA_RE.test(n.path)}).map(function(n){return n.path});
      if(!paths.length)return null;
      try{localStorage.setItem('moodwall.tree',JSON.stringify(paths))}catch(e){}
      return paths;
    })
    .catch(function(){clearTimeout(timer);return null});
}

/* ---------- storage ---------- */
var store={db:null,
  init:function(){var self=this;return new Promise(function(ok){try{var r=indexedDB.open('moodwall',2);
    r.onupgradeneeded=function(){var d=r.result;
      if(!d.objectStoreNames.contains('m'))d.createObjectStore('m',{keyPath:'id'});
      if(!d.objectStoreNames.contains('h'))d.createObjectStore('h',{keyPath:'id'})};
    r.onsuccess=function(){self.db=r.result;ok()};r.onerror=function(){ok()}}catch(e){ok()}})},
  run:function(mode,f){var self=this;return new Promise(function(ok){if(!self.db)return ok([]);try{var rq=f(self.db.transaction('m',mode).objectStore('m'));rq.onsuccess=function(){ok(rq.result)};rq.onerror=function(){ok([])}}catch(e){ok([])}})},
  all:function(){return this.run('readonly',function(s){return s.getAll()})},
  put:function(r){return this.run('readwrite',function(s){return s.put(r)})},
  del:function(id){return this.run('readwrite',function(s){return s.delete(id)})},
  hAll:function(){var self=this;return new Promise(function(ok){if(!self.db)return ok([]);try{var q=self.db.transaction('h','readonly').objectStore('h').getAll();q.onsuccess=function(){ok(q.result)};q.onerror=function(){ok([])}}catch(e){ok([])}})},
  hPut:function(r){var self=this;return new Promise(function(ok){if(!self.db)return ok();try{var q=self.db.transaction('h','readwrite').objectStore('h').put(r);q.onsuccess=q.onerror=function(){ok()}}catch(e){ok()}})},
  hDel:function(id){var self=this;return new Promise(function(ok){if(!self.db)return ok();try{var q=self.db.transaction('h','readwrite').objectStore('h').delete(id);q.onsuccess=q.onerror=function(){ok()}}catch(e){ok()}})}
};

/* ---------- helpers ---------- */
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function vis(){
  var real=items.filter(function(i){return !i.sample});
  var base=real.length?real:samples;
  return state.folder==='all'?base:base.filter(function(i){return i.folder===state.folder});
}
function shapeFor(k,isVideo){
  var L=SHAPES.length;
  if(state.shape==='auto')return SHAPES[state.cycle%L][0];
  if(state.shape==='mixed')return SHAPES[(k*3+(isVideo?2:0)+state.cycle)%L][0];
  return state.shape;
}
function mediaEl(it){
  var el;
  if(it.type==='video'){
    el=document.createElement('video');el.src=it.url;el.muted=true;el.loop=true;el.autoplay=true;el.playsInline=true;el.setAttribute('playsinline','');
    var p=el.play&&el.play();if(p&&p.catch)p.catch(function(){});
  }else{el=document.createElement('img');el.src=it.url;el.alt=it.name;el.draggable=false}
  el.addEventListener(it.type==='video'?'loadedmetadata':'load',function(){var t=el.closest('.tile');if(t&&t._box)fitTile(t,el)});
  return el;
}
/* resize a collage tile to the media's own aspect ratio so nothing is cropped */
function fitTile(t,el){
  var nw=el.naturalWidth||el.videoWidth,nh=el.naturalHeight||el.videoHeight,b=t._box;
  if(!nw||!nh)return;
  var a=nw/nh,h=b.mh,w=h*a;
  if(w>b.mw){w=b.mw;h=w/a}
  /* keep the rotated tile fully inside the padded stage */
  var hw=(w*Math.cos(b.rot)+h*Math.sin(b.rot))/2,hh=(h*Math.cos(b.rot)+w*Math.sin(b.rot))/2;
  var cx=Math.min(Math.max(b.cx,b.P+hw),b.W-b.P-hw),cy=Math.min(Math.max(b.cy,b.P+hh),b.H-b.P-hh);
  t.style.left=(cx-w/2)+'px';t.style.top=(cy-h/2)+'px';t.style.width=w+'px';t.style.height=h+'px';
}
function mkTile(it,k){
  var t=document.createElement('div');
  t.className='tile';t.tabIndex=0;t.setAttribute('role','button');t.setAttribute('aria-label','Open '+it.name);
  t.dataset.k=k;t.dataset.v=it.type==='video'?'1':'0';t._it=it;
  t.innerHTML='<div class="shape"><div class="mw"></div></div>';
  t.querySelector('.mw').appendChild(mediaEl(it));
  t.addEventListener('click',function(){openLb(t._it)});
  t.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openLb(t._it)}});
  t.style.setProperty('--clip',CLIPS[shapeFor(k,it.type==='video')]);
  return t;
}
function updateShapes(){
  document.querySelectorAll('.tile').forEach(function(t){
    t.style.setProperty('--clip',CLIPS[shapeFor(+t.dataset.k,t.dataset.v==='1')]);
  });
}

/* ---------- layouts ---------- */
function isPhone(){return window.matchMedia('(max-width:600px)').matches}
function turnPage(d){
  var n=vis().length;if(state.layout!=='collage'||n<=PAGE)return;
  state.batch=((state.batch+d*PAGE)%n+n)%n;last=Date.now();render();
}
function collage(list){
  var phone=isPhone(),W=stage.clientWidth,H=stage.clientHeight,P=Math.max(14,Math.round(Math.min(W,H)*.025));
  var N=Math.min(list.length,PAGE);
  /* phone: arrows sit in a bar under the photos, so keep that strip free */
  var W2=W-2*P,H2=H-2*P-(phone&&list.length>PAGE?60:0);
  var cols=Math.max(1,Math.round(Math.sqrt(N*W2/H2))),rows=Math.ceil(N/cols);
  var cw=W2/cols,ch=H2/rows,R=rng(state.seed*101+7),AS=[.8,1.15,.9,1,.75,1.3];
  for(var k=0;k<N;k++){
    var r=Math.floor(k/cols),c=k%cols,inRow=(r===rows-1)?N-r*cols:cols;
    var cx=P+(cols-inRow)*cw/2+(c+.5)*cw+(R()-.5)*cw*.15,cy=P+(r+.5)*ch+(R()-.5)*ch*.1;
    var a=AS[(k+state.seed)%6],w=Math.min(cw*1.2,ch*1.15*a),h=w/a;
    if(h>ch*1.15){h=ch*1.15;w=h*a}
    var t=mkTile(list[(state.batch+k)%list.length],k);
    var rot=(R()-.5)*(phone?9:16); /* calmer tilt on a small screen */
    t._box={cx:cx,cy:cy,mw:W2*.55,mh:Math.min(ch*1.15,H2),W:W,H:H,P:P,rot:Math.abs(rot)*Math.PI/180};
    t.style.cssText+=';left:'+(cx-w/2)+'px;top:'+(cy-h/2)+'px;width:'+w+'px;height:'+h+'px;z-index:'+Math.floor(R()*N)+';--r:'+rot.toFixed(1)+'deg;--d:'+k;
    stage.appendChild(t);
  }
  /* more photos than fit: arrows page through them; the last page wraps round to the start to stay full */
  if(list.length>PAGE){
    var pb=document.createElement('button'),nb=document.createElement('button');
    pb.className='nav prev';pb.type='button';pb.setAttribute('aria-label','Previous photos');pb.innerHTML='<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
    nb.className='nav next';nb.type='button';nb.setAttribute('aria-label','Next photos');nb.innerHTML='<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
    pb.onclick=function(){turnPage(-1)};nb.onclick=function(){turnPage(1)};
    stage.appendChild(pb);stage.appendChild(nb);
  }
}
function bento(list){
  var SP=['b2','','bt','','bw','','','bt','','bw'];
  list.forEach(function(it,i){var t=mkTile(it,i);var s=SP[i%SP.length];if(s)t.classList.add(s);stage.appendChild(t)});
}
function marquee(list,vertical,tilted){
  var W=stage.clientWidth*(tilted?1.5:1),H=stage.clientHeight*(tilted?1.5:1),gap=12;
  var n=vertical?(W<600?3:5):(tilted?4:3);
  stage.style.setProperty('--gap',gap+'px');
  var size=vertical?(W-gap*(n+1))/n:(H-gap*(n+1))/n,AS=[1,.8,1.25,.9,1.1],kk=0;
  var lanes=document.createElement('div');lanes.className='lanes'+(vertical?' v':'');
  for(var j=0;j<n;j++){
    var lane=list.filter(function(_,i){return i%n===j});
    if(!lane.length)lane=list.slice(j%list.length).concat(list.slice(0,j%list.length));
    var units=lane.map(function(it,i){var a=AS[(i+j)%5];return {it:it,len:vertical?size/a:size*a}});
    var seq=units.reduce(function(s,u){return s+u.len+gap},0);
    var reps=Math.max(1,Math.ceil((vertical?H:W)*1.2/seq));
    var laneEl=document.createElement('div');laneEl.className='lane';
    var track=document.createElement('div');track.className='track'+(vertical?' v':'');
    for(var copy=0;copy<2*reps;copy++){
      units.forEach(function(u){
        var t=mkTile(u.it,kk++);
        if(vertical){t.style.width=size+'px';t.style.height=u.len+'px'}else{t.style.height=size+'px';t.style.width=u.len+'px'}
        track.appendChild(t);
      });
    }
    var total=seq*reps*2;
    track.dataset.len=total;
    track.style.animationDuration=(total/2/state.speed)+'s';
    track.style.animationDelay='-'+(j*2.5)+'s';
    if(j%2)track.style.animationDirection='reverse';
    laneEl.appendChild(track);lanes.appendChild(laneEl);
  }
  stage.appendChild(lanes);
}
function slideshow(list){
  stage.innerHTML='<div class="holder"></div><button class="nav prev" type="button" aria-label="Previous">&#8249;</button><button class="nav next" type="button" aria-label="Next">&#8250;</button><div class="count"></div>';
  var holder=stage.querySelector('.holder'),count=stage.querySelector('.count');
  state.slide=state.slide%list.length;
  function draw(){
    var size=Math.min(stage.clientWidth*.84,stage.clientHeight*.8);
    holder.innerHTML='';
    var t=mkTile(list[state.slide],state.slide);t.style.width=size+'px';t.style.height=size+'px';holder.appendChild(t);
    count.textContent=(state.slide+1)+' of '+list.length;
  }
  function go(d){state.slide=(state.slide+d+list.length)%list.length;draw()}
  stage.querySelector('.prev').onclick=function(){go(-1)};
  stage.querySelector('.next').onclick=function(){go(1)};
  draw();
  slideT=setInterval(function(){go(1)},5000);
}

/* random background photo, cross-faded in; a different one each call */
var curBg=null;
function setBg(instant){
  var pics=vis().filter(function(i){return i.type!=='video'});
  if(!pics.length)return;
  var pool=pics.length>1?pics.filter(function(i){return i.url!==curBg}):pics;
  var bg=pool[Math.floor(Math.random()*pool.length)];curBg=bg.url;
  var layer=document.createElement('div');layer.className='bgpic';
  layer.style.backgroundImage='linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.3)),url("'+bg.url+'"),url("'+bg.url+'")';
  var old=stage.querySelectorAll('.bgpic');
  if(!instant){layer.style.opacity=0;layer.style.transition='opacity 1.6s'}
  stage.insertBefore(layer,old.length?old[old.length-1].nextSibling:stage.firstChild);
  if(!instant){
    layer.getBoundingClientRect();layer.style.opacity=1;
    setTimeout(function(){old.forEach(function(o){o.remove()})},1700);
  }
}
function render(){
  clearInterval(slideT);
  var list=vis();
  stage.innerHTML='';stage.removeAttribute('style');
  stage.className='stage '+state.layout+(state.frame?' framed':'');
  if(['rows','cols','tilt'].indexOf(state.layout)>-1)stage.classList.add('mq');
  if(!list.length)return;
  curBg=null;setBg(true);
  if(state.layout==='collage')collage(list);
  else if(state.layout==='bento')bento(list);
  else if(state.layout==='rows')marquee(list,false,false);
  else if(state.layout==='cols')marquee(list,true,false);
  else if(state.layout==='tilt')marquee(list,false,true);
  else slideshow(list);
  $('#hint').hidden=items.some(function(i){return !i.sample});
}

/* ---------- folder tabs ---------- */
var delArmed=false,delT=null;
function renderChips(){
  var chips=$('#chips');chips.innerHTML='';
  var real=items.filter(function(i){return !i.sample}),base=real.length?real:samples,counts={},names=[];
  base.forEach(function(i){if(!counts[i.folder]){counts[i.folder]=0;names.push(i.folder)}counts[i.folder]++});
  if(state.folder!=='all'&&!counts[state.folder])state.folder='all';
  function chip(label,val,n){
    var b=document.createElement('button');b.type='button';b.className='pill';
    b.setAttribute('role','tab');b.setAttribute('aria-selected',state.folder===val);
    b.textContent=label;var s=document.createElement('small');s.textContent=n;b.appendChild(s);
    b.onclick=function(){state.folder=val;state.batch=0;state.slide=0;delArmed=false;renderChips();render()};
    chips.appendChild(b);
  }
  chip('All','all',base.length);
  names.forEach(function(nm){chip(nm,nm,counts[nm])});
  if(real.length&&state.folder!=='all'){
    var isLinked=items.some(function(i){return i.folder===state.folder&&i.linkId});
    var d=document.createElement('button');d.type='button';d.className='pill del';
    d.textContent=delArmed?'Tap again to confirm':(isLinked?'Unlink folder':'Delete folder');
    d.onclick=function(){
      if(!delArmed){delArmed=true;renderChips();clearTimeout(delT);delT=setTimeout(function(){delArmed=false;renderChips()},3500);return}
      var f=state.folder,linkIds={};
      items=items.filter(function(i){
        if(i.folder!==f)return true;
        if(i.linkId)linkIds[i.linkId]=1;else store.del(i.id);
        if(i.url)URL.revokeObjectURL(i.url);
        return false;
      });
      Object.keys(linkIds).forEach(function(id){
        items=items.filter(function(i){if(i.linkId===id){if(i.url)URL.revokeObjectURL(i.url);return false}return true});
        linkedRecs=linkedRecs.filter(function(r){return r.id!==id});
        store.hDel(id);
      });
      state.folder='all';delArmed=false;renderChips();render();
    };
    chips.appendChild(d);
  }
}
function pills(el,list,get,set){
  el.innerHTML='';
  list.forEach(function(p){
    var b=document.createElement('button');b.type='button';b.className='pill';b.textContent=p[1];b.setAttribute('aria-pressed',get()===p[0]);
    b.onclick=function(){set(p[0]);savePrefs();pills(el,list,get,set)};
    el.appendChild(b);
  });
}
function buildDock(){}

/* ---------- shape timer ---------- */
function cycling(){return true}
function tick(){
  state.cycle++;updateShapes();setBg(false);
  if(state.layout==='collage'){
    var list=vis(),tiles=stage.querySelectorAll('.tile');
    if(list.length>tiles.length){
      state.batch+=tiles.length;
      tiles.forEach(function(t,k){
        var it=list[(state.batch+k)%list.length];t._it=it;t.dataset.v=it.type==='video'?'1':'0';
        var mw=t.querySelector('.mw');mw.innerHTML='';mw.appendChild(mediaEl(it));
      });
      updateShapes();
    }
  }
}
setInterval(function(){
  if((Date.now()-last)/1000>=state.interval){last=Date.now();tick()}
},200);

/* ---------- upload ---------- */
var sheet=$('#sheet');
function openSheet(){sheet.hidden=false;$('#fname').focus()}
function closeSheet(){sheet.hidden=true}
$('#hintAdd').onclick=openSheet;$('#sheetClose').onclick=closeSheet;
sheet.addEventListener('click',function(e){if(e.target===sheet)closeSheet()});
$('#pickFiles').onclick=function(){$('#fFiles').click()};
$('#pickDir').onclick=function(){$('#fDir').click()};
function isMedia(f){return /^(image|video)\//.test(f.type)||/\.(jpe?g|png|gif|webp|avif|heic|mp4|mov|webm|m4v)$/i.test(f.name)}
function isVideo(f){return /^video\//.test(f.type)||/\.(mp4|mov|webm|m4v)$/i.test(f.name)}
async function addEntries(entries){
  var fallback=($('#fname').value||'').trim()||'My media',added=0,lastFolder=null,folders={};
  for(var i=0;i<entries.length;i++){
    var f=entries[i].file;if(!isMedia(f))continue;
    var folder=entries[i].folder||fallback;
    var rec={id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),folder:folder,name:f.name,type:isVideo(f)?'video':'image',blob:f};
    items.push({id:rec.id,folder:rec.folder,name:rec.name,type:rec.type,blob:f,url:URL.createObjectURL(f)});
    store.put(rec);added++;folders[folder]=1;lastFolder=folder;
  }
  if(!added)return;
  state.folder=Object.keys(folders).length===1?lastFolder:'all';state.batch=0;state.slide=0;
  renderChips();render();closeSheet();
}
$('#fFiles').onchange=function(){
  addEntries(Array.from(this.files).map(function(f){return {file:f,folder:null}}));this.value='';
};
$('#fDir').onchange=function(){
  addEntries(Array.from(this.files).map(function(f){
    var p=f.webkitRelativePath||'';return {file:f,folder:p.indexOf('/')>0?p.split('/')[0]:null};
  }));this.value='';
};
async function walk(entry,top,out){
  if(entry.isFile){var f=await new Promise(function(r){entry.file(r,function(){r(null)})});if(f)out.push({file:f,folder:top})}
  else if(entry.isDirectory){
    var rd=entry.createReader(),b;
    do{b=await new Promise(function(r){rd.readEntries(r,function(){r([])})});for(var i=0;i<b.length;i++)await walk(b[i],top||entry.name,out)}while(b.length);
  }
}
window.addEventListener('dragover',function(e){e.preventDefault();stage.classList.add('drag')});
window.addEventListener('dragleave',function(e){if(!e.relatedTarget)stage.classList.remove('drag')});
window.addEventListener('drop',async function(e){
  e.preventDefault();stage.classList.remove('drag');
  var out=[],its=e.dataTransfer&&e.dataTransfer.items;
  if(its&&its.length&&its[0].webkitGetAsEntry){
    var ents=[];for(var i=0;i<its.length;i++){var en=its[i].webkitGetAsEntry();if(en)ents.push(en)}
    for(var j=0;j<ents.length;j++)await walk(ents[j],null,out);
  }else if(e.dataTransfer){out=Array.from(e.dataTransfer.files).map(function(f){return {file:f,folder:null}})}
  addEntries(out);
});

/* ---------- linked folders (auto-sync, Chrome/Edge desktop) ---------- */
var MEDIA_RE=/\.(jpe?g|png|gif|webp|avif|heic|mp4|mov|webm|m4v)$/i;
async function scanDir(dh,folder,out,isRoot){
  for await (var pair of dh.entries()){
    var name=pair[0],h=pair[1];
    if(h.kind==='file'){if(MEDIA_RE.test(name))out.push({h:h,folder:folder,name:name})}
    else await scanDir(h,isRoot?name:folder,out,false);
  }
}
async function syncLinked(rec,ask){
  var h=rec.handle,p=await h.queryPermission({mode:'read'});
  if(p!=='granted'){
    if(!ask)return false;
    p=await h.requestPermission({mode:'read'});
    if(p!=='granted')return false;
  }
  var root=linkedRecs.filter(function(r){return r.name===h.name}).length>1?h.name+' ('+rec.id.slice(-3)+')':h.name;
  var out=[];await scanDir(h,root,out,true);
  items=items.filter(function(i){if(i.linkId===rec.id){URL.revokeObjectURL(i.url);return false}return true});
  for(var i=0;i<out.length;i++){
    var f=await out[i].h.getFile();
    items.push({id:rec.id+':'+out[i].folder+'/'+out[i].name,linkId:rec.id,folder:out[i].folder,name:out[i].name,type:isVideo(f)?'video':'image',blob:f,url:URL.createObjectURL(f)});
  }
  return true;
}
$('#linkDir').onclick=async function(){
  if(!window.showDirectoryPicker){alert('Linking a folder needs Chrome or Edge on desktop. Use "Choose a folder" instead.');return}
  var dh;try{dh=await window.showDirectoryPicker({mode:'read'})}catch(e){return}
  var rec={id:'d'+Date.now().toString(36),name:dh.name,handle:dh};
  linkedRecs.push(rec);store.hPut(rec);
  await syncLinked(rec,true);
  state.folder='all';state.batch=0;state.slide=0;
  renderChips();render();closeSheet();
};
$('#reconnect').onclick=async function(){
  for(var i=0;i<linkedRecs.length;i++){try{await syncLinked(linkedRecs[i],true)}catch(e){}}
  this.hidden=true;renderChips();render();
};

/* ---------- lightbox & clean view ---------- */
function openLb(it){
  var lb=document.createElement('div');lb.className='lb';
  var m=document.createElement(it.type==='video'?'video':'img');m.src=it.url;
  if(it.type==='video'){m.controls=true;m.autoplay=true;m.playsInline=true}else m.alt=it.name;
  lb.appendChild(m);
  function close(){lb.remove();document.removeEventListener('keydown',esc)}
  function esc(e){if(e.key==='Escape')close()}
  lb.addEventListener('click',function(e){if(e.target!==m||it.type!=='video')close()});
  document.addEventListener('keydown',esc);document.body.appendChild(lb);
}
function setClean(on){
  document.body.classList.toggle('clean',on);$('#exitClean').hidden=!on;
  try{if(on&&document.fullscreenEnabled&&!document.fullscreenElement)document.documentElement.requestFullscreen();else if(!on&&document.fullscreenElement)document.exitFullscreen()}catch(e){}
  setTimeout(render,120);
}
$('#exitClean').onclick=function(){setClean(false)};

var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(state.layout!=='bento')render()},300)});

/* phone: swipe left/right; laptop: keyboard arrow keys */
var tx=0,ty=0;
stage.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
stage.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)turnPage(dx<0?1:-1);
},{passive:true});
document.addEventListener('keydown',function(e){
  if(e.target.closest&&e.target.closest('input,select,textarea'))return;
  if(e.key==='ArrowRight')turnPage(1);else if(e.key==='ArrowLeft')turnPage(-1);
});

/* ---------- boot ---------- */
(async function(){
  var paths=await discoverPhotos();
  if(!paths){try{paths=JSON.parse(localStorage.getItem('moodwall.tree')||'null')}catch(e){}}
  (paths||BUNDLED).slice().sort(function(a,b){
    var fa=a.split('/')[0],fb=b.split('/')[0];
    return fa===fb?(a<b?-1:1):(fa<fb?-1:1);
  }).forEach(function(p){
    var s=p.indexOf('/');
    items.push({id:'b:'+p,folder:p.slice(0,s),name:p.slice(s+1),type:VIDEO_RE.test(p)?'video':'image',url:encodeURI(p)});
  });
  await store.init();
  var recs=await store.all();
  (recs||[]).forEach(function(r){if(r&&r.blob)items.push({id:r.id,folder:r.folder,name:r.name,type:r.type,blob:r.blob,url:URL.createObjectURL(r.blob)})});
  linkedRecs=(await store.hAll())||[];
  var needs=false;
  for(var i=0;i<linkedRecs.length;i++){
    try{if(!(await syncLinked(linkedRecs[i],false)))needs=true}catch(e){needs=true}
  }
  $('#reconnect').hidden=!needs;
  buildDock();renderChips();render();
})();
})();
</script>
