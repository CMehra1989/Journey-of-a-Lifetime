<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chetan Mehra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Montserrat:wght@700;800&family=Newsreader:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --black:#000; --white:#fff; --ink:#111; --band:#f7f7f7; --mute:#b9b9b9; --gap:6px;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--white);color:var(--ink);font:400 16px/1.4 'Josefin Sans',system-ui,sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,.pic:focus-visible{outline:3px solid #e9937c;outline-offset:3px}

/* hero */
.hero{position:relative;flex:none;height:clamp(96px,17vh,190px);overflow:hidden;background:#d9d6e6;display:grid;place-items:center;text-align:center}
.hero .bg{position:absolute;inset:-12px;background-size:cover;background-position:center;filter:blur(3px);transition:opacity 1.4s}
.hero .wash{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.28))}
.hero .in{position:relative;padding:0 16px}
.hero h1{margin:0;font:800 clamp(24px,min(6.2vw,9vh),64px)/1 'Montserrat',sans-serif;letter-spacing:-.01em;text-transform:uppercase;color:var(--black)}

/* folder tabs */
.tabs{flex:none;background:var(--band);margin:12px 0 10px;display:flex;align-items:center;gap:26px;height:44px;overflow-x:auto;scrollbar-width:none;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tabs>:first-child{margin-left:auto}
.tabs>:last-child{margin-right:auto}
.tabs button{flex:none;background:none;border:0;padding:0 2px;height:44px;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;border-bottom:3px solid transparent;display:flex;align-items:center}
.tabs button[aria-selected="true"]{border-bottom-color:var(--black)}
.tabs i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--black);display:block}

/* context line (only for folders added on this device) */
.ctx{flex:none;display:flex;justify-content:center;align-items:center;gap:14px;font-size:15px;color:#555;padding:0 16px 6px;text-align:center}
.ctx:empty{display:none}
.ctx button{background:none;border:0;border-bottom:1.5px solid currentColor;padding:0;color:var(--ink);font-weight:600}
.ctx .danger{color:#b3321a}

/* gallery: fills the space left on the screen, no page scroll */
.wrap{flex:1;min-height:0;overflow:hidden;padding:0 0 8px}
.masonry{position:relative;height:100%}
.pic{position:absolute;display:block;overflow:hidden;background:#eee;cursor:zoom-in;border:0;padding:0;transition:opacity .35s}
.pic img,.pic video{display:block;width:100%;height:100%;object-fit:cover}
.pic video{pointer-events:none}

/* page arrows: middle of the left and right edges */
.arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:50;width:44px;height:44px;display:grid;place-items:center;padding:0;background:rgba(0,0,0,.5);border:0;border-radius:50%}
.arrow svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.arrow.prev{left:10px}
.arrow.next{right:10px}
.arrow:hover:not(:disabled){background:rgba(0,0,0,.8)}
.arrow:disabled{opacity:.2;cursor:default}

.empty{text-align:center;padding:60px 16px;color:#666;font-size:18px}
.notice{flex:none;background:var(--band);text-align:center;padding:12px 16px;font-size:15px}
.notice button{background:none;border:0;border-bottom:1.5px solid currentColor;padding:0;font-weight:600;margin-left:8px}

/* add sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:200;padding:16px}
.dlg{background:var(--white);width:min(460px,100%);padding:26px 24px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0;font:800 22px/1 'Montserrat',sans-serif;text-transform:uppercase}
.dlg p{margin:0;color:#555}
.dlg input[type=text]{border:0;border-bottom:2px solid var(--black);padding:8px 0;font-size:18px;border-radius:0}
.dlg .row{display:flex;gap:10px;flex-wrap:wrap}
.dlg .row button{border:1.5px solid var(--black);background:var(--white);padding:9px 16px;font-weight:600}
.dlg .row .go{background:var(--black);color:var(--white)}
body.drag::after{content:"Drop to add";position:fixed;inset:10px;border:3px dashed #e9937c;display:grid;place-items:center;font:800 28px 'Montserrat',sans-serif;background:rgba(255,255,255,.85);z-index:250;pointer-events:none}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;display:grid;place-items:center;padding:56px 70px}
.lb img,.lb video{max-width:100%;max-height:100%}
.lb button{position:absolute;background:none;border:0;color:#fff;font-size:44px;line-height:1;padding:10px 16px;opacity:.85}
.lb button:hover{opacity:1}
.lb .x{top:6px;right:8px;font-size:38px}
.lb .p{left:6px;top:50%;transform:translateY(-50%)}
.lb .n{right:6px;top:50%;transform:translateY(-50%)}
.lb .c{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#ddd;font-size:14px;letter-spacing:.06em}

@media (max-width:760px){
  :root{--gap:4px}
  .wrap{padding:0 0 6px}
  .arrow{width:34px;height:34px}
  .arrow svg{width:18px;height:18px}
  .arrow.prev{left:4px}
  .arrow.next{right:4px}
  .hero{height:clamp(80px,14vh,140px)}
  .lb{padding:56px 8px}
  .lb .p,.lb .n{top:auto;bottom:6px;transform:none}
}
@media (prefers-reduced-motion:reduce){.hero .bg{transition:none}}
</style>
</head>
<body>

<section class="hero" aria-label="Chetan Mehra">
  <div class="bg" id="heroBg"></div>
  <div class="wash"></div>
  <div class="in">
    <h1>Chetan Mehra</h1>
  </div>
</section>

<nav class="tabs" id="tabs" role="tablist" aria-label="Folders"></nav>

<div class="ctx" id="ctx"></div>
<div class="notice" id="notice" hidden>These are sample tiles. <button type="button" id="noticeAdd">Add your own photos</button></div>

<main class="wrap" id="main"></main>
<button class="arrow prev" id="prevPage" type="button" aria-label="Previous photos" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="arrow next" id="nextPage" type="button" aria-label="Next photos" hidden><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>

<div class="sheet" id="sheet" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">
    <h2 id="dlgT">Add photos</h2>
    <p>Files stay on this device. Pick a folder to keep its name, or type a name below for loose files.</p>
    <input type="text" id="fname" placeholder="Folder name, for example Goa trip" aria-label="Folder name">
    <div class="row">
      <button class="go" id="pickFiles" type="button">Choose files</button>
      <button id="pickDir" type="button">Choose a folder</button>
      <button id="closeAdd" type="button">Done</button>
    </div>
    <input type="file" id="fFiles" accept="image/*,video/*" multiple hidden>
    <input type="file" id="fDir" webkitdirectory multiple hidden>
  </div>
</div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};

/* ---------- state ---------- */
var state={folder:'all',q:'',page:0};
var PER=10,lastKey='';
var items=[],shown=[];

/* ---------- sample tiles (only until real photos exist) ---------- */
var PALS=[['#f6c9b8','#e9a38c','#fdf0e6'],['#bcd4e6','#8fb4d1','#eaf3f9'],['#cfe3c9','#9cc59a','#f1f8ee'],['#f2dca4','#e6b96a','#fff6e0'],['#d9c6ec','#b49bd6','#f4edfb'],['#f4b9c4','#e58a9d','#fdeef1'],['#c6e2e0','#8cc3c0','#eefaf9'],['#e7c9a9','#c99a6b','#faf0e4']];
function sampleSvg(i){
  var p=PALS[i%PALS.length],tall=(i%3===0)?560:(i%3===1)?440:500,cx=90+((i*83)%220),cy=110+((i*57)%120);
  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 '+tall+'"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+p[2]+'"/><stop offset="1" stop-color="'+p[0]+'"/></linearGradient></defs><rect width="400" height="'+tall+'" fill="url(#g)"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(46+(i%3)*10)+'" fill="'+p[2]+'" opacity=".9"/><path d="M0 '+(tall-140)+' Q110 '+(tall-210+(i%4)*14)+' 220 '+(tall-150)+' T400 '+(tall-170)+' V'+tall+' H0Z" fill="'+p[1]+'" opacity=".75"/><path d="M0 '+(tall-80)+' Q140 '+(tall-140)+' 260 '+(tall-80)+' T400 '+(tall-100)+' V'+tall+' H0Z" fill="'+p[1]+'"/></svg>';
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
var samples=[];for(var s=0;s<8;s++)samples.push({id:'s'+s,folder:'Sample',name:'Sample '+(s+1),type:'image',url:sampleSvg(s),sample:true});

/* ---------- bundled photos ---------- */
/* Every top-level repo folder becomes a folder here. On GitHub Pages the list is read live from the repo;
   this list is only the fallback when that is unavailable (offline, rate limit, opened as a local file). */
var BUNDLED=['Vaishno Devi 2023/454DB216-1EA8-4852-A869-5CE016A9F405.JPG','Vaishno Devi 2023/0362A76F-4642-41EC-9A8D-8154F42DF06A.JPG','Vaishno Devi 2023/541D9B8C-F1CB-4984-B044-85D7606E2597.JPG','Vaishno Devi 2023/87635430-7992-45F2-86CA-F863CF41E0C6.JPG','Vaishno Devi 2023/A06EC386-2E62-4A3C-8A35-8B7A570BC820.JPG','Vaishno Devi 2023/D8AA3D67-06C2-46FC-9697-CBAD03304034.JPG','Vaishno Devi 2023 -2/454DB216-1EA8-4852-A869-5CE016A9F405.JPG','Vaishno Devi 2023 -2/87A59FFD-89D4-456B-A028-1604C4D7C1E0.JPG','Vaishno Devi 2023 -2/IMG_0826.JPG'];
var MEDIA_RE=/\.(jpe?g|png|gif|webp|avif|bmp|mp4|webm|mov|m4v)$/i,VIDEO_RE=/\.(mp4|webm|mov|m4v)$/i;

function folderDates(folders){
  var m=location.hostname.match(/^([^.]+)\.github\.io$/i),repo=location.pathname.split('/')[1],cache={};
  try{cache=JSON.parse(localStorage.getItem('moodwall.fdates')||'{}')||{}}catch(e){}
  if(!m||!repo)return Promise.resolve(cache);
  var base='https://api.github.com/repos/'+m[1]+'/'+repo+'/commits?per_page=1&path=';
  function get(url){
    var ctl=window.AbortController?new AbortController():null,t=setTimeout(function(){if(ctl)ctl.abort()},5000);
    return fetch(url,ctl?{signal:ctl.signal}:{}).then(function(r){clearTimeout(t);if(!r.ok)throw 0;return r});
  }
  return Promise.all(folders.filter(function(f){return !cache[f]}).map(function(f){
    var u=base+encodeURIComponent(f);
    return get(u).then(function(r){
      var l=(r.headers.get('Link')||'').match(/[?&]page=(\d+)[^>]*>;\s*rel="last"/);
      return l?get(u+'&page='+l[1]):r;
    }).then(function(r){return r.json()}).then(function(j){
      var d=j&&j[0]&&j[0].commit&&(j[0].commit.committer||j[0].commit.author);
      if(d&&d.date)cache[f]=d.date;
    }).catch(function(){});
  })).then(function(){try{localStorage.setItem('moodwall.fdates',JSON.stringify(cache))}catch(e){}return cache});
}
function discoverPhotos(){
  var m=location.hostname.match(/^([^.]+)\.github\.io$/i),repo=location.pathname.split('/')[1];
  if(!m||!repo)return Promise.resolve(null);
  var ctl=window.AbortController?new AbortController():null,timer=setTimeout(function(){if(ctl)ctl.abort()},5000);
  return fetch('https://api.github.com/repos/'+m[1]+'/'+repo+'/git/trees/HEAD?recursive=1',ctl?{signal:ctl.signal}:{})
    .then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(j){
      clearTimeout(timer);
      var paths=(j.tree||[]).filter(function(n){return n.type==='blob'&&n.path.split('/').length===2&&n.path.charAt(0)!=='.'&&MEDIA_RE.test(n.path)}).map(function(n){return n.path});
      if(!paths.length)return null;
      try{localStorage.setItem('moodwall.tree',JSON.stringify(paths))}catch(e){}
      return paths;
    })
    .catch(function(){clearTimeout(timer);return null});
}

/* ---------- storage for photos added on this device ---------- */
var store={db:null,
  init:function(){var self=this;return new Promise(function(ok){try{var r=indexedDB.open('moodwall',2);
    r.onupgradeneeded=function(){var d=r.result;
      if(!d.objectStoreNames.contains('m'))d.createObjectStore('m',{keyPath:'id'});
      if(!d.objectStoreNames.contains('h'))d.createObjectStore('h',{keyPath:'id'})};
    r.onsuccess=function(){self.db=r.result;ok()};r.onerror=function(){ok()}}catch(e){ok()}})},
  run:function(mode,f){var self=this;return new Promise(function(ok){if(!self.db)return ok([]);try{var rq=f(self.db.transaction('m',mode).objectStore('m'));rq.onsuccess=function(){ok(rq.result)};rq.onerror=function(){ok([])}}catch(e){ok([])}})},
  all:function(){return this.run('readonly',function(s){return s.getAll()})},
  put:function(r){return this.run('readwrite',function(s){return s.put(r)})},
  del:function(id){return this.run('readwrite',function(s){return s.delete(id)})}
};

/* ---------- data helpers ---------- */
function base(){var real=items.filter(function(i){return !i.sample});return real.length?real:samples}
function folderList(){
  var seen={},out=[];
  base().forEach(function(i){
    if(!seen[i.folder]){seen[i.folder]={name:i.folder,count:0,cover:i,local:true};out.push(seen[i.folder])}
    seen[i.folder].count++;
    if(!i.local)seen[i.folder].local=false;
    if(seen[i.folder].cover.type==='video'&&i.type!=='video')seen[i.folder].cover=i;
  });
  return out;
}
function visible(){
  var q=state.q.trim().toLowerCase();
  return base().filter(function(i){
    if(state.folder!=='all'&&i.folder!==state.folder)return false;
    if(!q)return true;
    return (i.folder+' '+i.name).toLowerCase().indexOf(q)>-1;
  });
}

/* ---------- rendering ---------- */
var main=$('#main'),ctx=$('#ctx');
function mediaTag(it,lazy){
  var el;
  if(it.type==='video'){el=document.createElement('video');el.src=it.url;el.muted=true;el.loop=true;el.autoplay=true;el.playsInline=true;el.setAttribute('playsinline','');var p=el.play&&el.play();if(p&&p.catch)p.catch(function(){})}
  else{el=document.createElement('img');el.src=it.url;el.alt=it.name;el.draggable=false;if(lazy)el.loading='lazy'}
  return el;
}
var renderId=0,current=null,pageCount=1;
function whenSized(el,it){
  return new Promise(function(done){
    var t=setTimeout(done,4000);
    function fin(){clearTimeout(t);done()}
    if(it.type==='video'){el.addEventListener('loadedmetadata',fin);el.addEventListener('error',fin)}
    else if(el.complete&&el.naturalWidth)fin();
    else{el.addEventListener('load',fin);el.addEventListener('error',fin)}
  });
}
function aspectOf(el){
  var w=el.naturalWidth||el.videoWidth,h=el.naturalHeight||el.videoHeight;
  return (w&&h)?w/h:1.5;
}
/* split photos (in order) into R rows; amp makes alternate rows a little bigger / smaller */
function splitRows(ar,R,amp){
  var n=ar.length;if(R>n)return null;
  var pre=[0];ar.forEach(function(a,i){pre.push(pre[i]+a)});
  var tot=pre[n],w=[],ws=0,r,i,j;
  for(r=0;r<R;r++){var x=R>1?(r%2===0?1-amp:1+amp):1;w.push(x);ws+=x}
  var tgt=w.map(function(x){return tot*x/ws});
  var INF=1e18,dp=[],cut=[];
  for(r=0;r<=R;r++){dp.push(new Array(n+1).fill(INF));cut.push(new Array(n+1).fill(0))}
  dp[0][0]=0;
  for(r=1;r<=R;r++)for(i=r;i<=n;i++)for(j=r-1;j<i;j++){
    if(dp[r-1][j]>=INF)continue;
    var d=pre[i]-pre[j]-tgt[r-1],c=dp[r-1][j]+d*d;
    if(c<dp[r][i]){dp[r][i]=c;cut[r][i]=j}
  }
  var rows=[];i=n;
  for(r=R;r>=1;r--){j=cut[r][i];var row=[];for(var k=j;k<i;k++)row.push(k);rows.unshift(row);i=j}
  return rows;
}
function putTile(b,x,y,w,h){
  b.style.left=x+'px';b.style.top=y+'px';b.style.width=w+'px';b.style.height=h+'px';b.style.opacity=1;
}
/* Every row runs edge to edge and the rows together fill the full height: no side space.
   Photos keep their own proportions as closely as possible (a light crop evens out the fit).
   Wide photos get wider tiles, tall photos narrower ones, and rows differ in height. */
function layoutGallery(){
  if(!current)return;
  var box=current.box,tiles=current.tiles;
  var W=box.clientWidth,H=box.clientHeight;
  if(!W||!H)return;
  var g=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap'))||6;
  var ar=tiles.map(function(t){return aspectOf(t.el)});
  var n=ar.length,fill=null,fit=null;
  [0.12,0.06,0].forEach(function(amp){
    for(var R=1;R<=n;R++){
      var rows=splitRows(ar,R,amp);if(!rows)continue;
      var avail=H-g*(R-1);if(avail<=0)continue;
      var hs=rows.map(function(r){var sum=0;r.forEach(function(i){sum+=ar[i]});return (W-g*(r.length-1))/sum});
      var sumH=0;hs.forEach(function(h){sumH+=h});
      var k=sumH/avail;                                   /* 1 = no crop at all */
      var score=Math.abs(Math.log(k))+(0.12-amp)*0.8;
      if(!fill||score<fill.score)fill={rows:rows,hs:hs,k:k,score:score};
      var sc=Math.min(1,avail/sumH),area=0;
      rows.forEach(function(r,q){area+=hs[q]*sc*(W-g*(r.length-1))*sc});
      if(!fit||area>fit.area)fit={rows:rows,hs:hs,sc:sc,area:area};
    }
  });
  if(fill&&fill.k>=0.67&&fill.k<=1.5){
    var y=0;
    fill.rows.forEach(function(r,q){
      var nat=fill.hs[q],h=nat/fill.k,x=0;
      r.forEach(function(i){var w=ar[i]*nat;putTile(tiles[i].b,x,y,w,h);x+=w+g});
      y+=h+g;
    });
    return;
  }
  /* very few photos on a page: show them whole, centred, instead of cropping hard */
  if(!fit)return;
  var totalH=g*(fit.rows.length-1);fit.hs.forEach(function(h){totalH+=h*fit.sc});
  var y2=Math.max(0,(H-totalH)/2);
  fit.rows.forEach(function(r,q){
    var h=fit.hs[q]*fit.sc,rowW=g*(r.length-1);
    r.forEach(function(i){rowW+=ar[i]*h});
    var x2=(W-rowW)/2;
    r.forEach(function(i){var w=ar[i]*h;putTile(tiles[i].b,x2,y2,w,h);x2+=w+g});
    y2+=h+g;
  });
}
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(layoutGallery,120)});

function renderGallery(){
  var all=visible();
  var key=state.folder+'|'+state.q;
  if(key!==lastKey){state.page=0;lastKey=key}
  var pages=Math.max(1,Math.ceil(all.length/PER));
  pageCount=pages;
  if(state.page>=pages)state.page=pages-1;
  shown=all.slice(state.page*PER,state.page*PER+PER);
  main.innerHTML='';current=null;
  if(!shown.length){main.innerHTML='<div class="empty">No photos in this folder.</div>';renderPager(1);return}
  var box=document.createElement('div');box.className='masonry';
  var tiles=[],waits=[];
  shown.forEach(function(it,idx){
    var b=document.createElement('button');b.type='button';b.className='pic';b.setAttribute('aria-label','Open '+it.name);
    b.style.opacity=0;
    var el=mediaTag(it,false);b.appendChild(el);
    b.onclick=function(){openLb(idx)};
    tiles.push({b:b,el:el});waits.push(whenSized(el,it));
    box.appendChild(b);
  });
  main.appendChild(box);
  renderPager(pages);
  var id=++renderId;
  Promise.all(waits).then(function(){
    if(id!==renderId)return;
    current={box:box,tiles:tiles};
    layoutGallery();
  });
}
function turnPage(d){
  var p=state.page+d;
  if(p<0||p>=pageCount)return;
  state.page=p;renderGallery();
}
function renderPager(pages){
  var pv=$('#prevPage'),nx=$('#nextPage');
  if(pages<2){pv.hidden=true;nx.hidden=true;return}
  pv.hidden=false;nx.hidden=false;
  pv.disabled=state.page===0;
  nx.disabled=state.page===pages-1;
}
$('#prevPage').onclick=function(){turnPage(-1)};
$('#nextPage').onclick=function(){turnPage(1)};
function renderTabs(){
  var el=$('#tabs');el.innerHTML='';
  function tab(label,val){
    if(el.children.length){var dot=document.createElement('i');dot.setAttribute('aria-hidden','true');el.appendChild(dot)}
    var b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.textContent=label;
    b.setAttribute('aria-selected',state.folder===val);
    b.onclick=function(){state.folder=val;render()};
    el.appendChild(b);
  }
  tab('All','all');
  folderList().forEach(function(f){tab(f.name,f.name)});
}
function renderCtx(){
  ctx.innerHTML='';
  if(state.folder==='all')return;
  var f=folderList().filter(function(x){return x.name===state.folder})[0];
  if(!f||!f.local)return;
  var d=document.createElement('button');d.type='button';d.className='danger';d.textContent='Delete this folder';
  d.onclick=function(){
    if(!confirm('Delete "'+state.folder+'" from this device?'))return;
    var name=state.folder;
    items=items.filter(function(i){if(i.folder!==name)return true;store.del(i.id);if(i.url)URL.revokeObjectURL(i.url);return false});
    state.folder='all';render();
  };
  ctx.appendChild(d);
}
function render(){
  if(state.folder!=='all'&&!folderList().some(function(f){return f.name===state.folder}))state.folder='all';
  renderTabs();
  $('#notice').hidden=items.some(function(i){return !i.sample});
  renderCtx();
  renderGallery();
}

/* hero background: a random photo, blurred, changing slowly */
var heroUrl=null;
function setHero(){
  var pics=base().filter(function(i){return i.type!=='video'&&!i.sample});
  if(!pics.length)return;
  var pool=pics.length>1?pics.filter(function(i){return i.url!==heroUrl}):pics;
  var p=pool[Math.floor(Math.random()*pool.length)];heroUrl=p.url;
  var bg=$('#heroBg');bg.style.opacity=0;
  setTimeout(function(){bg.style.backgroundImage='url("'+p.url+'")';bg.style.opacity=1},300);
}
setInterval(setHero,25000);

/* ---------- lightbox ---------- */
function openLb(start){
  var idx=start,lb=document.createElement('div');lb.className='lb';lb.setAttribute('role','dialog');lb.setAttribute('aria-modal','true');
  var holder=document.createElement('div'),x=document.createElement('button'),p=document.createElement('button'),n=document.createElement('button'),c=document.createElement('div');
  x.className='x';x.type='button';x.textContent='\u00D7';x.setAttribute('aria-label','Close');
  p.className='p';p.type='button';p.textContent='\u2039';p.setAttribute('aria-label','Previous photo');
  n.className='n';n.type='button';n.textContent='\u203A';n.setAttribute('aria-label','Next photo');
  c.className='c';
  lb.appendChild(holder);lb.appendChild(x);lb.appendChild(c);
  if(shown.length>1){lb.appendChild(p);lb.appendChild(n)}
  function draw(){
    var it=shown[idx],m=document.createElement(it.type==='video'?'video':'img');m.src=it.url;
    if(it.type==='video'){m.controls=true;m.autoplay=true;m.playsInline=true}else m.alt=it.name;
    holder.innerHTML='';holder.appendChild(m);holder.style.cssText='display:contents';
    c.textContent=(idx+1)+' / '+shown.length;
  }
  function go(d){idx=(idx+d+shown.length)%shown.length;draw()}
  function close(){lb.remove();document.removeEventListener('keydown',key)}
  function key(e){if(e.key==='Escape')close();else if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1)}
  x.onclick=close;p.onclick=function(){go(-1)};n.onclick=function(){go(1)};
  lb.addEventListener('click',function(e){if(e.target===lb)close()});
  var tx=0;lb.addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});
  lb.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50&&shown.length>1)go(dx<0?1:-1)},{passive:true});
  document.addEventListener('keydown',key);document.body.appendChild(lb);draw();x.focus();
}

/* ---------- adding photos ---------- */
var sheet=$('#sheet');
function openSheet(){sheet.hidden=false;$('#fname').focus()}
function closeSheet(){sheet.hidden=true}
$('#noticeAdd').onclick=openSheet;$('#closeAdd').onclick=closeSheet;
sheet.addEventListener('click',function(e){if(e.target===sheet)closeSheet()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!sheet.hidden)closeSheet()});
$('#pickFiles').onclick=function(){$('#fFiles').click()};
$('#pickDir').onclick=function(){$('#fDir').click()};
function isMedia(f){return /^(image|video)\//.test(f.type)||/\.(jpe?g|png|gif|webp|avif|heic|mp4|mov|webm|m4v)$/i.test(f.name)}
function isVideo(f){return /^video\//.test(f.type)||/\.(mp4|mov|webm|m4v)$/i.test(f.name)}
function addEntries(entries){
  var fallback=($('#fname').value||'').trim()||'My photos',added=0,last=null,names={};
  entries.forEach(function(en){
    var f=en.file;if(!isMedia(f))return;
    var folder=en.folder||fallback;
    var rec={id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),folder:folder,name:f.name,type:isVideo(f)?'video':'image',blob:f};
    items.push({id:rec.id,folder:folder,name:rec.name,type:rec.type,blob:f,url:URL.createObjectURL(f),local:true});
    store.put(rec);added++;names[folder]=1;last=folder;
  });
  if(!added)return;
  state.q='';
  state.folder=Object.keys(names).length===1?last:'all';
  render();setHero();closeSheet();
}
$('#fFiles').onchange=function(){addEntries(Array.from(this.files).map(function(f){return {file:f,folder:null}}));this.value=''};
$('#fDir').onchange=function(){
  addEntries(Array.from(this.files).map(function(f){var p=f.webkitRelativePath||'';return {file:f,folder:p.indexOf('/')>0?p.split('/')[0]:null}}));this.value='';
};
async function walk(entry,top,out){
  if(entry.isFile){var f=await new Promise(function(r){entry.file(r,function(){r(null)})});if(f)out.push({file:f,folder:top})}
  else if(entry.isDirectory){
    var rd=entry.createReader(),b;
    do{b=await new Promise(function(r){rd.readEntries(r,function(){r([])})});for(var i=0;i<b.length;i++)await walk(b[i],top||entry.name,out)}while(b.length);
  }
}
window.addEventListener('dragover',function(e){e.preventDefault();document.body.classList.add('drag')});
window.addEventListener('dragleave',function(e){if(!e.relatedTarget)document.body.classList.remove('drag')});
window.addEventListener('drop',async function(e){
  e.preventDefault();document.body.classList.remove('drag');
  var out=[],its=e.dataTransfer&&e.dataTransfer.items;
  if(its&&its.length&&its[0].webkitGetAsEntry){
    var ents=[];for(var i=0;i<its.length;i++){var en=its[i].webkitGetAsEntry();if(en)ents.push(en)}
    for(var j=0;j<ents.length;j++)await walk(ents[j],null,out);
  }else if(e.dataTransfer){out=Array.from(e.dataTransfer.files).map(function(f){return {file:f,folder:null}})}
  addEntries(out);
});

/* ---------- keyboard and swipe: change page ---------- */
document.addEventListener('keydown',function(e){
  if(document.querySelector('.lb')||!sheet.hidden)return;
  if(e.key==='ArrowRight')turnPage(1);else if(e.key==='ArrowLeft')turnPage(-1);
});
var sx=0,sy=0;
main.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
main.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)turnPage(dx<0?1:-1);
},{passive:true});

/* ---------- boot ---------- */
(async function(){
  var paths=await discoverPhotos();
  if(!paths){try{paths=JSON.parse(localStorage.getItem('moodwall.tree')||'null')}catch(e){}}
  paths=paths||BUNDLED;
  var names=[];paths.forEach(function(p){var f=p.split('/')[0];if(names.indexOf(f)<0)names.push(f)});
  var dates=await folderDates(names);
  /* newest folder first; folders with no known date go last, alphabetically */
  paths.slice().sort(function(a,b){
    var fa=a.split('/')[0],fb=b.split('/')[0];
    if(fa===fb)return a<b?-1:1;
    var da=dates[fa]||'',db=dates[fb]||'';
    if(da!==db)return da>db?-1:1;
    return fa<fb?-1:1;
  }).forEach(function(p){
    var s=p.indexOf('/');
    items.push({id:'b:'+p,folder:p.slice(0,s),name:p.slice(s+1),type:VIDEO_RE.test(p)?'video':'image',url:encodeURI(p)});
  });
  await store.init();
  var recs=await store.all();
  (recs||[]).forEach(function(r){if(r&&r.blob)items.push({id:r.id,folder:r.folder,name:r.name,type:r.type,blob:r.blob,url:URL.createObjectURL(r.blob),local:true})});
  render();setHero();
})();
})();
</script>
